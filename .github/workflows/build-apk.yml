name: Build Android APK v2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create dummy .env file
        run: |
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForBuildOnly" > .env
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForBuildOnly" > .env.example || true

      - name: Generate Local Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK to Makharej.apk
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Makharej.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makharej
          path: app/build/outputs/apk/debug/Makharej.apk
